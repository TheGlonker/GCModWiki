<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GC Modding Wiki</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #111111;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            padding: 30px;
            text-align: center;
        }

        .logo {
            display: block;
            width: min(400px, 80vw);
            height: auto;
            margin: 0 auto 28px;
        }

        .loader {
            width: 70px;
            height: 70px;
            margin: 0 auto;
            border: 8px solid rgba(255, 255, 255, 0.15);
            border-top-color: #76f15b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .message {
            display: none;
            margin-top: 24px;
            font-size: clamp(1.5rem, 5vw, 2rem);
            font-weight: 700;
            opacity: 0;
        }

        .message.show {
            display: block;
            animation: fade-in 0.5s ease forwards;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
